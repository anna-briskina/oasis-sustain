# Same as quick.yaml but with nilearn's standard SPM8-normalised maps instead of DARTEL.
# Separate name, so caches and outputs never mix with the DARTEL run.
name: oasis1_quick_spm8
seed: 42

cohort:
  min_age: 60
  dartel_version: false

regions:
  hippocampus: [Left Hippocampus, Right Hippocampus]
  amygdala: [Left Amygdala, Right Amygdala]
  parahippocampal_ant: ["Parahippocampal Gyrus, anterior division"]
  temporal_pole: [Temporal Pole]
  inferior_temporal: ["Inferior Temporal Gyrus, anterior division", "Inferior Temporal Gyrus, posterior division"]
  precuneus: [Precuneous Cortex]
  lateral_parietal: [Angular Gyrus, "Supramarginal Gyrus, posterior division"]
  frontal: [Middle Frontal Gyrus, Superior Frontal Gyrus]

zscore:
  levels: [1, 2]

sustain:
  n_subtypes_max: 2
  n_startpoints: 10
  n_mcmc: 10000

cv:
  n_folds: 3

analysis:
  n_subtypes: auto
